# Build against the NEWEST version you support (1.21.11), not the oldest.
# Fabric mods compile against one concrete version, but if you don't touch
# any API that changed between patches, the same jar keeps working on
# older patch versions too -- which is what the "minecraft" range in
# fabric.mod.json is declaring.
#
# Double check these three numbers at https://fabricmc.net/develop
# by selecting "1.21.11" from the Minecraft version dropdown there --
# yarn_mappings and fabric_version below are placeholders and WILL be
# wrong by the time you build; the site always has the current ones.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.1

mod_version=1.0.0
maven_group=com.example.mcoptimizer
archives_base_name=mc-optimizer

fabric_version=0.141.6+1.21.11
